services:
  postgres:
    image: postgres:16-alpine
    container_name: pcs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-product_content_studio}
    # Host port is configurable so the container can coexist with another Postgres on 5432.
    # The container-internal port is always 5432.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile full up --build` runs the app in a container too.
  # A plain `docker compose up -d` starts only Postgres, so `npm run dev` stays the inner loop.
  app:
    build: .
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-product_content_studio}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    ports:
      - '3000:3000'

volumes:
  pgdata:
